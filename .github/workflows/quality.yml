name: Comprobaciones de Stubbs Jobs

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Instalar bibliotecas de Python
        run: python -m pip install -r requirements.txt
      - name: Compilar el acceso de Windows con el icono actual
        shell: powershell
        run: .\tools\build-launcher.ps1
      - name: Comprobar código y recorridos con datos ficticios
        run: python -B tools/check-quality.py --output outputs/ci
